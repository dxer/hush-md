name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: test + clippy
    # Exercise AppKit and Metal on macOS; Windows compilation runs separately.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      # sccache hashes each compilation unit's inputs, so the vendored path
      # dependencies (gpui, taffy, async-tar) stop recompiling just because a
      # fresh checkout gave them a new mtime. The target/ cache below cannot
      # do that.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the channel and asks for clippy; rustup
      # installs both here, so local and CI use the same compiler.
      - name: Install toolchain
        run: rustup component add clippy

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          env-vars: MACOSX_DEPLOYMENT_TARGET

      - name: Build application
        run: cargo build --release --locked

      - name: Tests, bundled guides and clippy
        run: scripts/check.sh

      # No signing certificate in CI, so the .dmg is unsigned and un-notarized:
      # good enough to try a build, not to hand to users. Releasing properly
      # still means running scripts/package.sh on a machine with the Developer
      # ID certificate.
      - name: Package (unsigned)
        run: PACKAGE_UNSIGNED=1 scripts/package.sh

      - name: Upload macOS build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hush-md-macos-${{ github.sha }}
          path: |
            dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  windows-build:
    name: Windows x64 build
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Build application with Windows SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ tools were not found' }
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          & cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }

      - name: Package installer (unsigned)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          # The runner image ships Inno Setup; the version in the folder name moves.
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}/Inno Setup*/ISCC.exe" | Select-Object -Last 1
          if (!$iscc) { throw 'ISCC.exe was not found; Inno Setup is missing from the runner image' }
          # -File instead of & ./script.ps1: the runner's execution policy is
          # not ours to change, and the developer environment set above is
          # inherited by the child process. -SkipBuild: the step above just did it.
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/package-windows.ps1 -Iscc "$($iscc.FullName)" -SkipBuild
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }

      - name: Upload Windows build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hush-md-windows-${{ github.sha }}
          path: |
            dist/windows/unsigned/*.exe
            dist/windows/unsigned/*.sha256
          if-no-files-found: error
          retention-days: 30

  # Pushing a v* tag publishes the two installers the jobs above built.
  # Assets come from this run's artifacts, so the tag matched the commit
  # that was actually compiled.
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: hush-md-*
          merge-multiple: true

      - name: List assets
        run: find dist -type f -printf '%p %s bytes\n'

      - name: Create the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
