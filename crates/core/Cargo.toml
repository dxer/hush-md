# The document engine: model, DocxXML, the editing core, the library on
# disk, import and export. No GPUI, so it builds and tests on its own.
[package]
name = "hush_core"
version = "0.1.3"
edition = "2024"
description = "The Markdown engine behind hush.md: block model, Markdown parsing and lossless writing, editing core"
license = "MIT"
readme = "../../README.md"
authors = ["dxer"]

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
quick-xml = "0.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-segmentation = "1.13.3"
uuid = { version = "1.28.0", features = ["v4"] }
rustc-hash = "2.1"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
# Deleting a note moves it to the system trash, so it can be recovered
# outside the app.
trash = "5.2"

[lints]
workspace = true
