[package]
name = "hush_md"
version = "0.1.0"
edition = "2024"
description = "A fast, quiet Markdown editor and reader, drawn natively with GPUI"
license = "MIT"
readme = "README.md"
authors = ["dxer"]
keywords = ["notes", "markdown", "editor", "gpui", "local-first"]
categories = ["text-editors"]

# `hush_core` is the GPUI-free document engine; plain `cargo test` covers both.
[workspace]
members = ["crates/core"]
default-members = [".", "crates/core"]

[dependencies]
hush_core = { path = "crates/core" }
anyhow = "1.0.104"
dirs = "7.0.0"
gpui = "0.2.2"
quick-xml = "0.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-segmentation = "1.13.3"
uuid = { version = "1.28.0", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
rustc-hash = "2.1"
katex-rs = { version = "0.3", default-features = false }
regex = "1"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "=0.10.0"
objc = "0.2"

# GPUI 0.2.2 with local changes: glyphs are rasterized without font
# smoothing (Feishu's `-webkit-font-smoothing: antialiased`) and grids take
# explicit pixel column widths. Taffy 0.9.0 with the beyond-limits fix for
# items spanning several auto rows (merged table cells).
[patch.crates-io]
gpui = { path = "vendor/gpui" }
taffy = { path = "vendor/taffy" }
# zed-async-tar (via gpui's http client) enables xattr 0.2, which no longer
# builds against current libc on Linux. The local copy leaves it off: we never
# unpack tar archives with extended attributes.
async-tar = { path = "vendor/async-tar", package = "zed-async-tar" }

# `objc`'s msg_send! checks `feature = "cargo-clippy"`, which rustc no longer
# knows about.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

# Style lints that fight the code's deliberate shape (GPUI closures with
# long types, pixel tables indexed by column, enums of laid-out lines).
[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
field_reassign_with_default = "allow"
wrong_self_convention = "allow"
unusual_byte_groupings = "allow"

[lints]
workspace = true
